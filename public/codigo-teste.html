<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Código de barras para teste</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;font-family:Arial;color:#202b42}.card{background:#fff;padding:48px;border-radius:18px;text-align:center;box-shadow:0 12px 40px #18203820}.bars{height:180px;display:flex;justify-content:center;align-items:stretch;margin:28px 0 10px}.bar{width:4px;background:#111}.space{width:4px}.code{font:24px monospace;letter-spacing:5px}p{color:#687284;font-size:15px}</style><main class="card"><h1>Código de barras para teste</h1><p>Abra o cadastro do produto e aponte a câmera para este código.</p><div id="bars" class="bars"></div><div class="code">5901234123457</div></main><script>const bits='1010010111010011110011001001100110100001010001101010011101101100110001001011100100111010001000100 101'.replace(' ','');document.getElementById('bars').innerHTML=[...bits].map(x=>`<i class="${x==='1'?'bar':'space'}"></i>`).join('')</script></html>
